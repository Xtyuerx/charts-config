<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>附件分步 · MessagePack 数据查看器</title>
<style>
:root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#22324a;background:#f3f6fa;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,select{cursor:pointer}button{border:1px solid #dbe3ed;background:#fff;color:#334963;border-radius:7px;padding:8px 13px}button:hover{background:#edf4ff}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9fc7ff;outline-offset:2px}header{padding:30px 32px 24px;background:#fff;border-bottom:1px solid #e0e7ef}.eyebrow{font-size:12px;letter-spacing:2px;color:#4974ad}h1{font-size:25px;margin:10px 0;font-weight:600}p{color:#64748b;line-height:1.7;margin:0}.source{margin-top:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.badge{padding:5px 9px;background:#edf4ff;color:#2863ac;border-radius:5px;font-size:12px}main{padding:24px 32px;max-width:1800px;margin:auto}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}.stat{background:#fff;border:1px solid #e0e7ef;border-radius:10px;padding:18px}.stat span{display:block;color:#64748b;font-size:12px}.stat strong{display:block;font-size:26px;margin:8px 0 2px;font-weight:600;font-variant-numeric:tabular-nums}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:20px}.panel{background:#fff;border:1px solid #e0e7ef;border-radius:10px;min-width:0}.toolbar{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;padding:18px;border-bottom:1px solid #e9edf3}.toolbar h2,aside h2{font-size:16px;margin:0}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}select{padding:8px;border:1px solid #dbe3ed;border-radius:7px;background:white;color:#334963}#step-input{width:65px;padding:7px;border:1px solid #dbe3ed;border-radius:6px}#step-range{width:150px;accent-color:#2479ed}.timeline-wrap{overflow:auto;padding:8px 20px 22px}.timeline{min-width:760px}.axis,.row{display:grid;grid-template-columns:125px minmax(0,1fr);align-items:center}.axis{height:40px;color:#718198;font-size:11px}.ticks{position:relative;height:26px;margin:0 8px}.tick{position:absolute;top:7px;transform:translateX(-50%)}.group{padding:12px 0;color:#667991;font-size:12px;border-top:1px solid #e9edf3}.row{height:39px;border-bottom:1px solid #eff3f8}.row.selected{background:#edf4ff}.tooth{display:flex;align-items:center;gap:8px;padding-left:8px}.tooth button{padding:4px 8px;border-color:transparent;background:transparent;color:#334963;font-weight:600}.kind{color:#8490a1;font-size:11px}.track{height:100%;position:relative;margin:0 8px;background:repeating-linear-gradient(to right,#eaf0f7 0,#eaf0f7 1px,transparent 1px,transparent calc(100% / 43))}.baseline{position:absolute;left:0;right:0;top:50%;height:1px;background:#e2e8f0}.interval{position:absolute;top:calc(50% - 5px);height:10px;background:#8dc0ff;border:0;border-radius:3px;padding:0;min-width:6px}.interval:hover{background:#5ca4ff}.interval:before,.interval:after{content:"";position:absolute;top:0;width:10px;height:10px;background:#2479ed;transform:rotate(45deg)}.interval:before{left:-4px}.interval:after{right:-4px}.selected .interval{background:#599fff}.cursor{position:absolute;top:0;bottom:0;width:2px;background:#1b70e4;pointer-events:none;z-index:2}.axis .cursor{top:2px}.cursor-label{position:absolute;left:50%;transform:translateX(-50%);background:#1b70e4;color:#fff;padding:2px 4px;border-radius:3px;font-size:11px;top:-1px}.detail{padding:20px}#detail-title{margin:14px 0 5px;font-size:25px}.detail dl{margin:24px 0}.detail dt{font-size:12px;color:#718198;margin-top:17px}.detail dd{margin:6px 0 0;overflow-wrap:anywhere;color:#263951}.detail small{display:block;color:#718198;line-height:1.7}.detail pre{overflow:auto;font-size:11px;background:#f4f7fb;padding:12px;border-radius:6px;color:#465873;max-height:200px}.empty-groups{margin-top:20px;padding:18px 20px}.empty-groups h2{font-size:14px;margin:0 0 12px}.empty-groups p{font-size:12px;overflow-wrap:anywhere}.note{padding:16px 20px;font-size:12px;border-top:1px solid #e9edf3;color:#718198;line-height:1.8}.empty{padding:30px;color:#718198}@media(max-width:1000px){.workspace{grid-template-columns:1fr}.detail dl{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detail dt{margin:0}.stats{gap:10px}}@media(max-width:600px){header{padding:22px 16px}main{padding:16px}.stats{grid-template-columns:1fr 1fr}.toolbar{align-items:flex-start}.controls{gap:6px}#step-range{width:110px}.detail dl{display:block}.detail dt{margin-top:16px}}
</style>
</head>
<body>
<header><div class="eyebrow">MESSAGEPACK EXPLORER</div><h1>附件分步数据</h1><p>按牙位查看附件的生效区间与原始字段。</p><div class="source"><span class="badge">0.msgpack</span><span id="source-info"></span></div></header>
<main>
<section class="stats" aria-label="文件概览"><div class="stat"><span>附件记录</span><strong id="count"></strong><span>attachment_step_info</span></div><div class="stat"><span>步数范围</span><strong id="range"></strong><span>文件记录的起止步数</span></div><div class="stat"><span>附件类型</span><strong id="types"></strong><span>rectangle_h / rotate</span></div><div class="stat"><span>网格数据</span><strong id="mesh-size"></strong><span>压缩二进制 · drcp</span></div></section>
<div class="workspace"><section class="panel"><div class="toolbar"><h2>分步时间轴</h2><div class="controls"><label for="jaw">牙位分组</label><select id="jaw"><option value="all">全部</option><option value="upper">上颌</option><option value="lower">下颌</option></select><button id="previous" aria-label="上一步">←</button><label for="step-input">第</label><input id="step-input" type="number" min="0" step="1" value="0" aria-label="当前步数"><span>步</span><button id="next" aria-label="下一步">→</button><input id="step-range" type="range" min="0" step="1" value="0" aria-label="切换步数"></div></div><div class="timeline-wrap"><div class="timeline" id="timeline"></div></div><div class="note">点击蓝色区间或牙位查看详情。图中只展示文件实际包含的起止点；此文件的所有附件区间均为 0～43。上下颌按常见牙位编号分组。</div></section>
<aside class="panel detail" aria-label="选中附件详情"><h2>附件详情</h2><div id="details" aria-live="polite"></div></aside></div>
<section class="panel empty-groups"><h2>其他数据分组</h2><div id="other-groups"></div></section>
</main>
<script id="file-data" type="application/json">{"sourceBytes": 1340350, "decodedBytes": 670175, "records": [{"attach_id": "rectangle_h", "tid": 13, "start_step": 0, "end_step": 43, "movement_type": 1, "transformBytes": 136, "meshType": "drcp", "meshBytes": 42792}, {"attach_id": "rectangle_h", "tid": 14, "start_step": 0, "end_step": 43, "movement_type": 1, "transformBytes": 136, "meshType": "drcp", "meshBytes": 38749}, {"attach_id": "rectangle_h", "tid": 15, "start_step": 0, "end_step": 43, "movement_type": 1, "transformBytes": 136, "meshType": "drcp", "meshBytes": 42807}, {"attach_id": "rectangle_h", "tid": 17, "start_step": 0, "end_step": 43, "movement_type": 1, "transformBytes": 136, "meshType": "drcp", "meshBytes": 38749}, {"attach_id": "rotate", "tid": 23, "start_step": 0, "end_step": 43, "movement_type": 1, "transformBytes": 136, "meshType": "drcp", "meshBytes": 39840}, {"attach_id": "rectangle_h", "tid": 24, "start_step": 0, "end_step": 43, "movement_type": 1, "transformBytes": 136, "meshType": "drcp", "meshBytes": 42865}, {"attach_id": "rectangle_h", "tid": 25, "start_step": 0, "end_step": 43, "movement_type": 1, "transformBytes": 136, "meshType": "drcp", "meshBytes": 42807}, {"attach_id": "rectangle_h", "tid": 26, "start_step": 0, "end_step": 43, "movement_type": 1, "transformBytes": 136, "meshType": "drcp", "meshBytes": 42913}, {"attach_id": "rectangle_h", "tid": 27, "start_step": 0, "end_step": 43, "movement_type": 1, "transformBytes": 136, "meshType": "drcp", "meshBytes": 38749}, {"attach_id": "rectangle_h", "tid": 33, "start_step": 0, "end_step": 43, "movement_type": 1, "transformBytes": 136, "meshType": "drcp", "meshBytes": 42807}, {"attach_id": "rectangle_h", "tid": 34, "start_step": 0, "end_step": 43, "movement_type": 1, "transformBytes": 136, "meshType": "drcp", "meshBytes": 42865}, {"attach_id": "rectangle_h", "tid": 35, "start_step": 0, "end_step": 43, "movement_type": 1, "transformBytes": 136, "meshType": "drcp", "meshBytes": 42913}, {"attach_id": "rectangle_h", "tid": 36, "start_step": 0, "end_step": 43, "movement_type": 1, "transformBytes": 136, "meshType": "drcp", "meshBytes": 38749}, {"attach_id": "rectangle_h", "tid": 43, "start_step": 0, "end_step": 43, "movement_type": 1, "transformBytes": 136, "meshType": "drcp", "meshBytes": 42807}, {"attach_id": "rectangle_h", "tid": 44, "start_step": 0, "end_step": 43, "movement_type": 1, "transformBytes": 136, "meshType": "drcp", "meshBytes": 42807}, {"attach_id": "rectangle_h", "tid": 45, "start_step": 0, "end_step": 43, "movement_type": 1, "transformBytes": 136, "meshType": "drcp", "meshBytes": 42865}], "otherGroups": {"function_attachment_step_info": 0, "negative_attachment_step_info": 0, "ma_attachment_step_info": 0}}</script>
<script>
(() => {
 const data=JSON.parse(document.getElementById('file-data').textContent);
 const records=data.records;
 const byId=id=>document.getElementById(id);
 const maxStep=Math.max(0,...records.map(r=>r.end_step));
 let current=0,selected=0;
 const format=n=>`${(n/1024).toFixed(1)} KB`;
 byId('source-info').textContent=`十六进制 MessagePack · ${format(data.sourceBytes)} · 解码 ${format(data.decodedBytes)}`;
 byId('count').textContent=records.length;
 byId('range').textContent=`${Math.min(...records.map(r=>r.start_step))}–${maxStep}`;
 byId('types').textContent=new Set(records.map(r=>r.attach_id)).size;
 byId('mesh-size').textContent=format(records.reduce((s,r)=>s+r.meshBytes,0));
 byId('step-input').max=byId('step-range').max=maxStep;
 function details(){
  const r=records[selected],host=byId('details');
  host.replaceChildren();
  const title=document.createElement('h3');title.id='detail-title';title.textContent=`牙位 ${r.tid}`;host.append(title);
  const badge=document.createElement('span');badge.className='badge';badge.textContent=r.attach_id;host.append(badge);
  const dl=document.createElement('dl');
  const fields=[['附件标识 · attach_id',r.attach_id],['牙位编号 · tid',r.tid],['起止步数',`${r.start_step} → ${r.end_step}`],['当前步状态',current>=r.start_step&&current<=r.end_step?'位于记录区间内':'位于记录区间外'],['movement_type',`${r.movement_type}（枚举含义待确认）`],['transformation',`${r.transformBytes} 字节 · 二进制`],['attach_mesh',`${r.meshType} · ${format(r.meshBytes)}`]];
  for(const [label,value] of fields){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=value;dl.append(dt,dd)}host.append(dl);
  const small=document.createElement('small');small.textContent='网格头部包含 DRACO 标记。这里展示数据摘要，尚未渲染三维网格。';host.append(small);
  const disclosure=document.createElement('details'),summary=document.createElement('summary'),pre=document.createElement('pre');summary.textContent='查看字段摘要';pre.textContent=JSON.stringify(r,null,2);disclosure.append(summary,pre);host.append(disclosure);
 }
 function render(){
  const host=byId('timeline');host.replaceChildren();
  const axis=document.createElement('div');axis.className='axis';axis.innerHTML='<span>牙位 / 附件</span><div class="ticks"></div>';const ticks=axis.querySelector('.ticks');
  for(let i=0;i<=maxStep;i++){const tick=document.createElement('span');tick.className='tick';tick.style.left=`${i/maxStep*100}%`;tick.textContent=i;ticks.append(tick)}
  const marker=document.createElement('div');marker.className='cursor';marker.style.left=`${current/maxStep*100}%`;const markerLabel=document.createElement('span');markerLabel.className='cursor-label';markerLabel.textContent=current;marker.append(markerLabel);ticks.append(marker);host.append(axis);
  for(const group of [{id:'upper',label:'上颌',test:r=>r.tid<30},{id:'lower',label:'下颌',test:r=>r.tid>=30}]){
   if(byId('jaw').value!=='all'&&byId('jaw').value!==group.id)continue;
   const subset=records.map((r,i)=>({r,i})).filter(({r})=>group.test(r));
   const label=document.createElement('div');label.className='group';label.textContent=`${group.label} · ${subset.length} 条附件`;host.append(label);
   for(const {r,i} of subset){const row=document.createElement('div');row.className=`row${selected===i?' selected':''}`;const tooth=document.createElement('div');tooth.className='tooth';const btn=document.createElement('button');btn.textContent=r.tid;btn.setAttribute('aria-label',`查看牙位 ${r.tid} 附件`);btn.setAttribute('aria-pressed',String(selected===i));btn.onclick=()=>{selected=i;render();details()};const kind=document.createElement('span');kind.className='kind';kind.textContent=r.attach_id==='rotate'?'rotate':'rectangle_h';tooth.append(btn,kind);
    const track=document.createElement('div');track.className='track';const baseline=document.createElement('div');baseline.className='baseline';const interval=document.createElement('button');interval.className='interval';interval.style.left=`${r.start_step/maxStep*100}%`;interval.style.width=`${(r.end_step-r.start_step)/maxStep*100}%`;interval.setAttribute('aria-label',`牙位 ${r.tid}，${r.attach_id}，第 ${r.start_step} 到 ${r.end_step} 步`);interval.setAttribute('aria-pressed',String(selected===i));interval.title=`${r.tid} · ${r.attach_id} · ${r.start_step}–${r.end_step}`;interval.onclick=()=>{selected=i;render();details()};const cursor=document.createElement('div');cursor.className='cursor';cursor.style.left=`${current/maxStep*100}%`;track.append(baseline,interval,cursor);row.append(tooth,track);host.append(row)
   }
  }
  byId('previous').disabled=current===0;byId('next').disabled=current===maxStep;
 }
 function setStep(value){const n=Number(value);if(!Number.isFinite(n))return;current=Math.max(0,Math.min(maxStep,Math.round(n)));byId('step-input').value=current;byId('step-range').value=current;byId('timeline').querySelectorAll('.cursor').forEach(el=>el.style.left=`${current/maxStep*100}%`);byId('timeline').querySelector('.cursor-label').textContent=current;byId('previous').disabled=current===0;byId('next').disabled=current===maxStep;details()}
 byId('previous').onclick=()=>setStep(current-1);byId('next').onclick=()=>setStep(current+1);byId('step-input').onchange=e=>setStep(e.target.value);byId('step-range').oninput=e=>setStep(e.target.value);byId('jaw').onchange=()=>{const filter=byId('jaw').value;if(filter==='upper'&&records[selected].tid>=30)selected=records.findIndex(r=>r.tid<30);if(filter==='lower'&&records[selected].tid<30)selected=records.findIndex(r=>r.tid>=30);render();details()};
 for(const [key,count] of Object.entries(data.otherGroups)){const p=document.createElement('p');p.textContent=`${key}：${count} 条`;byId('other-groups').append(p)}
 render();details();
})();
</script>
</body>
</html>
