<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>附件三维预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#233349;font:14px "Microsoft YaHei",system-ui,sans-serif}header{padding:25px 30px;background:white;border-bottom:1px solid #e0e6ed}h1{font-size:24px;margin:0 0 9px}p{margin:0;color:#68788d;line-height:1.7}main{max-width:1600px;margin:auto;padding:24px;display:grid;grid-template-columns:minmax(360px,1.1fr) minmax(360px,1fr);gap:22px}.viewer,.gallery{min-width:0}.viewer{position:sticky;top:20px;align-self:start;background:white;border:1px solid #dde4ed;border-radius:12px;overflow:hidden}.viewer-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:20px;border-bottom:1px solid #e6ebf1}h2{margin:0;font-size:18px}.tag{color:#54708f;font-size:12px;margin-top:6px}#viewport{height:490px;position:relative;background:radial-gradient(ellipse at center,#f8fafc,#e7edf4)}#viewport canvas{display:block;max-width:100%;touch-action:none}.toolbar{display:flex;gap:9px;flex-wrap:wrap;padding:14px 20px;border-top:1px solid #e6ebf1}button{font:inherit;cursor:pointer;border:1px solid #d6dfe9;background:white;color:#29425f;border-radius:7px;padding:8px 12px}button:hover{background:#edf4ff}button:focus-visible{outline:3px solid #72aaff;outline-offset:2px}button[aria-pressed=true]{border-color:#2c7be5;background:#edf5ff}.hint{padding:0 20px 16px;font-size:12px;color:#64748b}#metrics{font-size:12px;color:#64748b;line-height:1.8;padding:0 20px 16px}#status{margin-bottom:16px;font-size:13px;color:#53708e;line-height:1.8}.group-title{font-size:14px;margin:20px 0 12px}.group-title:first-child{margin-top:0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.model-card{text-align:left;display:block;overflow:hidden;padding:0;border-radius:10px;background:#fff}.model-card img{width:100%;aspect-ratio:1.25;object-fit:contain;display:block;background:#eaf0f6}.model-card .placeholder{aspect-ratio:1.25;display:flex;align-items:center;justify-content:center;background:#eaf0f6;color:#728196}.model-card .label{padding:11px;display:block}.model-card strong{display:block;font-size:14px;margin-bottom:4px}.model-card small{font-size:11px;color:#68788d}.note{margin-top:20px;font-size:12px;color:#718196;line-height:1.8}#error{padding:18px;color:#b42318;white-space:pre-wrap} @media(min-width:1450px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:850px){main{grid-template-columns:1fr;padding:16px}.viewer{position:static}#viewport{height:400px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:520px){header{padding:20px 16px}#viewport{height:340px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.viewer-head{padding:16px}}
</style>
<script type="importmap">{"imports":{"three":"./attachment-models/lib/three.module.js"}}</script>
</head>
<body>
<header><h1>附件三维预览</h1><p>0.msgpack · 16 个附件 · 点击缩略图查看真实网格形状</p></header>
<main><section class="viewer"><div class="viewer-head"><div><h2 id="title">正在读取附件…</h2><div class="tag" id="type"></div></div><button id="reset">重置视角</button></div><div id="viewport" aria-label="附件三维模型，可拖动旋转和滚轮缩放"></div><div class="toolbar"><button id="solid" aria-pressed="true">实体</button><button id="wireframe" aria-pressed="false">线框</button><button id="front">正视</button><button id="side">侧视</button><button id="back">背视</button></div><div id="metrics"></div><div class="hint">左键拖动旋转 · 滚轮缩放 · 右键拖动平移</div><div id="error" role="alert" hidden></div></section><section class="gallery"><div id="status" role="status">正在解码原始 Draco 网格…</div><div id="cards"></div><p class="note">每个附件单独居中展示，视图会自动适配大小，缩略图不代表附件之间的实际尺寸比例。未叠加牙齿模型，未应用含义尚未确认的 transformation 数据。</p></section></main>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from './attachment-models/lib/OrbitControls.js';
import {DRACOLoader} from './attachment-models/lib/DRACOLoader.js';
const $=id=>document.getElementById(id);
let renderer,controls,thumbRenderer,loader;
try{
 const response=await fetch('./attachment-models/data.json');if(!response.ok)throw Error('附件清单读取失败');const records=await response.json();
 renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0xeaf0f6,0);renderer.outputColorSpace=THREE.SRGBColorSpace;$('viewport').append(renderer.domElement);
 const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight(0xffffff,0x73849b,2.4));const light=new THREE.DirectionalLight(0xffffff,3.5);light.position.set(4,6,8);scene.add(light);const rim=new THREE.DirectionalLight(0xb9d9ff,2);rim.position.set(-4,2,-5);scene.add(rim);
 const camera=new THREE.PerspectiveCamera(35,1,0.01,1000);controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
 const material=new THREE.MeshStandardMaterial({color:0xe7ce9f,roughness:0.52,metalness:0.02,side:THREE.DoubleSide});const mesh=new THREE.Mesh(new THREE.BufferGeometry(),material);scene.add(mesh);
 let selected=-1,radius=1,wireframe=false;const models=[],buttons=[];
 function fit(direction=new THREE.Vector3(1.5,1,2)){camera.position.copy(direction.normalize().multiplyScalar(radius*3.7));camera.near=radius/100;camera.far=radius*100;camera.updateProjectionMatrix();controls.target.set(0,0,0);controls.minDistance=radius*0.3;controls.maxDistance=radius*20;controls.update()}
 function select(index){if(!models[index])return;selected=index;const r=records[index],g=models[index];mesh.geometry=g;radius=g.boundingSphere.radius;fit();$('title').textContent=`牙位 ${r.tid} 的附件`;$('type').textContent=r.attach_id;const a=g.boundingBox.getSize(new THREE.Vector3());$('metrics').textContent=`顶点 ${g.getAttribute('position').count.toLocaleString()} · 三角面 ${((g.index?.count??g.getAttribute('position').count)/3).toLocaleString()} · 边界尺寸 ${a.x.toFixed(2)} × ${a.y.toFixed(2)} × ${a.z.toFixed(2)}（原始坐标单位）`;buttons.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===index)));$('viewport').dataset.selectedTooth=r.tid}
 const resize=()=>{const el=$('viewport');renderer.setSize(el.clientWidth,el.clientHeight);camera.aspect=el.clientWidth/el.clientHeight;camera.updateProjectionMatrix()};new ResizeObserver(resize).observe($('viewport'));resize();
 renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
 $('reset').onclick=()=>fit();$('front').onclick=()=>fit(new THREE.Vector3(0,0,1));$('side').onclick=()=>fit(new THREE.Vector3(1,0,0));$('back').onclick=()=>fit(new THREE.Vector3(0,0,-1));
 function setWireframe(value){wireframe=value;material.wireframe=value;$('solid').setAttribute('aria-pressed',String(!value));$('wireframe').setAttribute('aria-pressed',String(value))}$('solid').onclick=()=>setWireframe(false);$('wireframe').onclick=()=>setWireframe(true);
 for(const group of [{label:'上颌附件',test:r=>r.tid<30},{label:'下颌附件',test:r=>r.tid>=30}]){const title=document.createElement('h3');title.className='group-title';title.textContent=group.label;const grid=document.createElement('div');grid.className='grid';$('cards').append(title,grid);records.forEach((r,i)=>{if(!group.test(r))return;const b=document.createElement('button');b.className='model-card';b.disabled=true;b.setAttribute('aria-label',`查看牙位 ${r.tid} 的 ${r.attach_id} 附件`);b.setAttribute('aria-pressed','false');const placeholder=document.createElement('span');placeholder.className='placeholder';placeholder.textContent='解码中…';const label=document.createElement('span');label.className='label';const tooth=document.createElement('strong');tooth.textContent=`牙位 ${r.tid}`;const type=document.createElement('small');type.textContent=r.attach_id;label.append(tooth,type);b.append(placeholder,label);b.onclick=()=>select(i);grid.append(b);buttons[i]=b})}
 loader=new DRACOLoader();loader.setDecoderPath('./draco/');loader.setWorkerLimit(2);
 thumbRenderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});thumbRenderer.setSize(320,256);thumbRenderer.setClearColor(0xeaf0f6,1);thumbRenderer.outputColorSpace=THREE.SRGBColorSpace;
 const thumbScene=scene.clone();const thumbMesh=thumbScene.children.find(o=>o.isMesh);const thumbCamera=new THREE.PerspectiveCamera(35,320/256,0.01,1000);
 let loaded=0,failed=0;for(let i=0;i<records.length;i++){
  try{const r=records[i];const geometry=await loader.loadAsync(`./attachment-models/${r.file}`);if(!geometry.getAttribute('position')?.count)throw Error('网格没有顶点');geometry.computeVertexNormals();geometry.center();geometry.computeBoundingBox();geometry.computeBoundingSphere();models[i]=geometry;thumbMesh.geometry=geometry;const size=geometry.boundingSphere.radius;thumbCamera.near=size/100;thumbCamera.far=size*100;thumbCamera.position.set(1.5,1,2).normalize().multiplyScalar(size*3.7);thumbCamera.lookAt(0,0,0);thumbCamera.updateProjectionMatrix();thumbRenderer.render(thumbScene,thumbCamera);const img=document.createElement('img');img.src=thumbRenderer.domElement.toDataURL('image/png');img.alt=`牙位 ${r.tid} 的 ${r.attach_id} 附件模型`;buttons[i].firstElementChild.replaceWith(img);buttons[i].disabled=false;loaded++;if(selected<0)select(i)}catch(error){failed++;buttons[i].firstElementChild.textContent='解码失败';buttons[i].title=String(error)}
  $('status').textContent=`已加载 ${loaded} / ${records.length} 个附件${failed?` · ${failed} 个失败`:''}`;
 }
 $('status').dataset.loaded=loaded;$('status').dataset.failed=failed;thumbRenderer.dispose();loader.dispose();
 window.addEventListener('pagehide',()=>{renderer.setAnimationLoop(null);renderer.dispose();controls.dispose();material.dispose();models.forEach(g=>g?.dispose())},{once:true});
}catch(error){$('error').hidden=false;$('error').textContent=`模型加载失败：${error.message}`;$('status').textContent='加载失败';console.error(error)}
</script>
</body>
</html>
